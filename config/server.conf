# LinSFT server configuration (key = value, '#' starts a comment).
# Relative paths are resolved from the directory you start the server in (the project root).

bind_address = 127.0.0.1        # use 0.0.0.0 to accept clients from other machines
port = 9090
storage_dir = storage           # uploaded files live here (real Linux files, mode 0640)
db_path = data/linsft.db        # SQLite database (mode 0600)
log_path = logs/server.log
max_clients = 64
max_file_size = 536870912       # bytes (512 MiB)
session_ttl_seconds = 1800      # idle session timeout
idle_timeout_seconds = 300      # drop silent TCP connections
pbkdf2_iterations = 100000      # password hashing cost
